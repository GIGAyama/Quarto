<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!--
      Content-Security-Policy

      ・script-src 'self' … 本体は Vite が外部ファイルへ切り出すので満たせる。
        インラインの <script> や onclick= を足すと、この指定のせいで黙って動かなくなる。
        'unsafe-inline' で解決してはいけない（CSP を入れた意味がほとんど無くなる）。
      ・style-src に 'unsafe-inline' が要る … SweetAlert2 が実行時に <style> を差し込むため。
      ・fonts.googleapis.com / fonts.gstatic.com … 表示用の Web フォント（§2-7）。
        塞がれても端末側のフォントに落ちるだけでアプリは動く。
      ・connect-src 'self' … このアプリは外部に一切通信しない。

      frame-ancestors はここには書かない。<meta> で配ると無視され、
      読み込みのたびにコンソールへ警告が出るだけになる。
      他サイトへの埋め込みを止めるには HTTP ヘッダーが要るが GitHub Pages では足せない。
      独自ドメインや CDN を挟むときに、そちら側で frame-ancestors 'none' を設定すること。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src 'self';
        worker-src 'self';
        manifest-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />

    <!--
      インストールの合図を「いちばん先に」受け取る。
      Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
      React や three.js の読み込みより後だと合図を取りこぼし、
      通信が遅い端末で「インストール」ボタンが出なくなる。
    -->
    <script src="/Quarto/install-hook.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="3Dボードゲーム「クアルト！」のWebアプリ版。属性を4つそろえて勝負！" />
    <meta name="theme-color" content="#ffca28" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" href="/Quarto/favicon.png" />
    <!--
      apple-touch-icon には透明を含む画像を指さない。
      iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
      この画像は scripts/generate-icons.mjs が下地 #fff9c4 で塗りつぶして作る。
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Quarto/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="クアルト！" />
    <title>GIGAクアルト！</title>

    <!--
      「まっ白よけ」の見た目。
      本体の CSS（assets/*.css）が届かなかったときにも出したいので、
      外のファイルに置かず、ここに直に書く。
      style-src の 'unsafe-inline' で許してある（上の CSP 参照）。

      ⚠️ 出るまでに 12秒待たせる。
        校内 Wi-Fi が混んでいると読み込みに 10秒近くかかることがあり、
        すぐ出すと「ちゃんと開いている最中」に警告が割り込む。
      ⚠️ 待ち時間は animation-delay で作る。
        index.css の prefers-reduced-motion は animation-duration だけを潰すので、
        duration ではなく delay に持たせておけば、動きを減らす設定でも待ち時間は残る。
      ⚠️ この節は <div id="root"> の中に置く。
        React は最初の描画で root の中身を空にするため、
        アプリが立ち上がりさえすれば、この節は勝手に消える。
    -->
    <style>
      .boot-fallback {
        animation: boot-fallback-in 1ms linear 12s forwards;
        background: #fff9c4;
        box-sizing: border-box;
        color: #5d4037;
        font-family: 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', system-ui, sans-serif;
        inset: 0;
        opacity: 0;
        padding: 24px 16px;
        position: fixed;
        text-align: center;
      }
      @keyframes boot-fallback-in {
        to { opacity: 1; }
      }
      .boot-fallback__card {
        background: #fff;
        border: 5px solid #ffca28;
        border-radius: 20px;
        margin: 0 auto;
        max-width: 480px;
        padding: 24px 20px;
      }
      .boot-fallback__title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      .boot-fallback__btn {
        background: #ffca28;
        border-radius: 999px;
        color: #5d4037;
        display: inline-block;
        font-weight: 700;
        /* 児童が押すので当たり判定は 44px を下回らせない */
        min-height: 44px;
        padding: 11px 24px;
        text-decoration: none;
      }
      .boot-fallback__hint {
        font-size: 13px;
        margin: 20px 0 0;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="alert">
        <div class="boot-fallback__card">
          <p aria-hidden="true" style="font-size: 40px; margin: 0 0 8px">🧩</p>
          <p class="boot-fallback__title">うまく ひらけませんでした</p>
          <p>つうしんが うまく いって いないようです。</p>
          <p style="margin-bottom: 20px">したの ボタンを おして みて ください。</p>
          <a class="boot-fallback__btn" href="/Quarto/">もういちど ひらく</a>
          <p class="boot-fallback__hint">
            先生へ：何度やっても この画面のままなら、ブラウザの再読み込み（Ctrl+Shift+R）か、
            設定の「閲覧履歴データの削除 → キャッシュされた画像とファイル」をお試しください。
            アプリとして入れている場合は、いったん削除して入れ直すと直ります。
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
